services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: luxury_wheel
      POSTGRES_PASSWORD: "${SERVERPOD_PASSWORD_database:-local-development-only}"
    volumes:
      - luxury_wheel_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "${SERVERPOD_PASSWORD_redis:-local-development-only}"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: luxury_wheel_test
      POSTGRES_PASSWORD: "${SERVERPOD_PASSWORD_database:-local-test-only}"
    volumes:
      - luxury_wheel_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "${SERVERPOD_PASSWORD_redis:-local-test-only}"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  luxury_wheel_data:
  luxury_wheel_test_data:
